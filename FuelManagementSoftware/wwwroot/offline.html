<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetroChain - Offline</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: #F8FAFC; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 400px; padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #64748B; line-height: 1.6; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        .btn { display: inline-block; margin-top: 1.5rem; padding: 10px 24px; background: #1D4ED8; color: #fff; border: none; border-radius: 8px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⛽</div>
        <h1>You're offline</h1>
        <p>PetroChain requires an internet connection for real-time fuel data and blockchain verification.</p>
        <button class="btn" onclick="location.reload()">Retry Connection</button>
    </div>
</body>
</html>
